
name: Build
on:
  workflow_call:
    inputs:
      image-tag:
        description: Docker tag to create
        required: false
        default: latest
        type: string
      env-name:
        required: true
        type: string



permissions:
  id-token: write
  contents: read

env:
  AWS_REGION : "us-east-1"

#  ECR_REPO: 917902836630.dkr.ecr.us-east-1.amazonaws.com/report-server
#  ECR_ADDRESS: 917902836630.dkr.ecr.us-east-1.amazonaws.com


jobs:
  setup-vars:
    uses: ./.github/workflows/_setup.yaml
    with:
      env-name: ${{ inputs.env-name }}
  build:
    name: Docker Build and Push
    needs: setup-vars
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::917902836630:role/github-oidc-build-secrets
          role-session-name: gha-oidc-secrets
          aws-region: ${{ env.AWS_REGION }}

      - name: Get secrets by name and by ARN
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          parse-json-secrets: true
          secret-ids: |
            ,cmiml-devops
            

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ needs.setup-vars.outputs.ecr-role }}
          role-session-name: gha-oidc-build
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ needs.setup-vars.outputs.ecr }}

      - name: Generate short sha
        id: sha
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            DD_GIT_REPOSITORY_URL=${{ github.repositoryUrl }}
            DD_GIT_COMMIT_SHA=${{ github.sha }}
          cache-to: mode=max,image-manifest=true,oci-mediatypes=true,type=registry,ref=${{ needs.setup-vars.outputs.ecr }}/report-server:cache
          cache-from: type=registry,ref=${{ needs.setup-vars.outputs.ecr }}:cache
          tags: |
            ${{ needs.setup-vars.outputs.ecr }}/report-server:${{ inputs.image-tag }}
            ${{ needs.setup-vars.outputs.ecr }}/report-server:sha-${{ steps.sha.outputs.SHORT_SHA }}
          platforms: linux/amd64,linux/arm64
